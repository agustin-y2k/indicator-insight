[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-insight-backend"
version = "0.1.0"
description = "Indicator Insight modular backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.11,<1", "pip-tools>=7,<8",
  "setuptools>=80,<83",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
